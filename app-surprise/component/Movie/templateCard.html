<div class="movie__cards__card" onclick="{{onclick}}">
  <img class="movie__img" src="https://mmi.unilim.fr/~khireddine3/SAE2.03-starter-project/server/images/{{image}}" alt="Nom du film">
  <h3 class="movie__cards__card__title">{{movie_name}}</h3>
  <div class="movie__hover">
    <h2 class="movie__item">{{movie_name}}</h2>
    <h2 class="movie__item">{{category_name}}</h2>
    <p class="movie__item">{{description}}</p>
  </div> 
</div>
